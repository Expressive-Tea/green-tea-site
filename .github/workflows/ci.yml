name: CI

# Build gate. Runs on both forges (path .github is read by Gitea and GitHub).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      # Only a critical advisory blocks, as in release.yml. The site ships built files, not
      # node_modules; a build-time advisory with no published fix would otherwise block every PR.
      # audit.yml still files an issue for moderate and up, and the full report prints here.
      - run: npm audit --audit-level=critical
      - run: npm audit
        continue-on-error: true
      - run: npm run check
