name: Promote → GitHub

# Runs on GITEA ONLY. Mirrors main, and nothing else, to the public GitHub repo.
#
# No tags. The site deploys by hand to cPanel, so a tag on GitHub has nothing to trigger. Pushing
# them also broke this job: `git push --tags` is refused whenever a tag points at different objects
# on the two forges (v26.8.1-beta.0 and v26.8.2-beta.0 did), and that failed every promotion even
# though main had already arrived.
on:
  push:
    branches: [main]

jobs:
  push-github:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PROMOTE_TOKEN }}
        run: |
          git remote add github "https://x-access-token:${GH_TOKEN}@github.com/Expressive-Tea/green-tea-site.git"
          git push github "HEAD:refs/heads/main"
